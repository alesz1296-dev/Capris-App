name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: capris_ci
          POSTGRES_USER: capris_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U capris_ci -d capris_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api/v1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare CI runtime environment
        shell: bash
        run: |
          {
            echo "DATABASE_URL=postgresql://capris_ci@127.0.0.1:5432/capris_ci?schema=public"
            echo "JWT_ACCESS_SECRET=$(openssl rand -hex 32)"
            echo "JWT_REFRESH_SECRET=$(openssl rand -hex 32)"
            echo "MEDIA_URL_SIGNING_SECRET=$(openssl rand -hex 32)"
          } >> "$GITHUB_ENV"

      - name: Typecheck workspaces
        run: npm run typecheck

      - name: Validate Prisma schema
        run: npm --workspace apps/api run db:validate

      - name: Sync test database schema
        run: npm --workspace apps/api run db:push

      - name: Test
        run: npm test

      - name: Build shared package
        run: npm --workspace @capris/shared run build

      - name: Build API
        run: npm --workspace apps/api run build

      - name: Build web
        run: npm --workspace apps/web run build
