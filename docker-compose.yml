services:
  postgres:
    image: postgres:16
    container_name: capris-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-capris_app}
      POSTGRES_USER: ${POSTGRES_USER:-capris_local_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - capris_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-capris_local_user} -d ${POSTGRES_DB:-capris_app}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: capris-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Costa_Rica}
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://<db_user>:<db_password>@postgres:5432/capris_app?schema=public}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local-access-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-local-refresh-secret}
      MEDIA_URL_SIGNING_SECRET: ${MEDIA_URL_SIGNING_SECRET:-local-media-signing-secret}
      MEDIA_URL_TTL_SECONDS: 900
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:-}
      PORT: ${API_PORT:-4000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-local-google-client-id}
    ports:
      - "${API_PORT:-4000}:4000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/v1/system-health/readiness').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: capris-web
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4000/api/v1}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-local-google-client-id}
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  capris_postgres_data:
