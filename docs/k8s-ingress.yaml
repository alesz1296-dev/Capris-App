apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: capris
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 25m
spec:
  ingressClassName: nginx
  rules:
    - host: app.capris.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: capris-web
                port:
                  number: 3000
    - host: api.capris.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: capris-api
                port:
                  number: 4000
