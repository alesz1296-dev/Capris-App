apiVersion: apps/v1
kind: Deployment
metadata:
  name: capris-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: capris-web
  template:
    metadata:
      labels:
        app: capris-web
    spec:
      containers:
        - name: web
          image: ghcr.io/your-org/capris-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: capris-config
          readinessProbe:
            httpGet:
              path: /api/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
